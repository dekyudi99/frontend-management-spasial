services:
  react-management-spatial:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: react-management-spatial
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    networks:
      - shared_db_net

networks:
  shared_db_net:
    external: true
    name: network_gis